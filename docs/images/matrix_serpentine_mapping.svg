<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#10b981"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#bgGrad2)"/>
  <rect x="1" y="1" width="958" height="478" rx="15" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="40" y="44" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">LED Matrix Coordinate Mapping: Serpentine vs. Progressive</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#94a3b8">Physical 1D LED chain ordering across 2D rows (Horizontal Axis, Origin: Top-Left)</text>

  <!-- ==================== LEFT: SERPENTINE (ZIG-ZAG) ==================== -->
  <g transform="translate(40, 100)" filter="url(#shadow2)">
    <rect width="420" height="340" rx="12" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="2"/>
    <rect x="20" y="16" width="380" height="36" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="210" y="38" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">A. Serpentine (Zig-Zag / Snake) — Standard</text>

    <!-- Grid cells 4 rows x 4 cols demo -->
    <g transform="translate(60, 75)">
      <!-- Row 0: 0 -> 1 -> 2 -> 3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="55" height="45" rx="6" fill="#047857" stroke="#10b981"/>
        <text x="27" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 0</text>
        <line x1="55" y1="22" x2="80" y2="22" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <rect x="80" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="107" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 1</text>
        <line x1="135" y1="22" x2="160" y2="22" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <rect x="160" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="187" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 2</text>
        <line x1="215" y1="22" x2="240" y2="22" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <rect x="240" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="267" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 3</text>
      </g>

      <!-- Curve down from 3 to 4 (Right side turnaround) -->
      <path d="M 295 22.5 C 325 22.5, 325 82.5, 295 82.5" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

      <!-- Row 1: 7 <- 6 <- 5 <- 4 (Reversed / Right-to-Left!) -->
      <g transform="translate(0, 60)">
        <!-- LED 4 -->
        <rect x="240" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="267" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 4</text>
        <!-- Arrow 4 -> 5 -->
        <line x1="240" y1="22.5" x2="215" y2="22.5" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <!-- LED 5 -->
        <rect x="160" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="187" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 5</text>
        <!-- Arrow 5 -> 6 -->
        <line x1="160" y1="22.5" x2="135" y2="22.5" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <!-- LED 6 -->
        <rect x="80" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="107" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 6</text>
        <!-- Arrow 6 -> 7 -->
        <line x1="80" y1="22.5" x2="55" y2="22.5" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <!-- LED 7 -->
        <rect x="0" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="27" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 7</text>
      </g>

      <!-- Curve down from 7 to 8 (Left side turnaround) -->
      <path d="M 0 82.5 C -30 82.5, -30 142.5, 0 142.5" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

      <!-- Row 2: 8 -> 9 -> 10 -> 11 -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="27" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 8</text>
        <line x1="55" y1="22.5" x2="80" y2="22.5" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <rect x="80" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="107" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 9</text>
        <line x1="135" y1="22.5" x2="160" y2="22.5" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <rect x="160" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="187" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 10</text>
        <line x1="215" y1="22.5" x2="240" y2="22.5" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <rect x="240" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="267" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 11</text>
      </g>

      <!-- Curve down from 11 to 12 (Right side turnaround) -->
      <path d="M 295 142.5 C 325 142.5, 325 202.5, 295 202.5" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

      <!-- Row 3: 15 <- 14 <- 13 <- 12 (Reversed / Right-to-Left!) -->
      <g transform="translate(0, 180)">
        <!-- LED 12 -->
        <rect x="240" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="267" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 12</text>
        <!-- Arrow 12 -> 13 -->
        <line x1="240" y1="22.5" x2="215" y2="22.5" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <!-- LED 13 -->
        <rect x="160" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="187" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 13</text>
        <!-- Arrow 13 -> 14 -->
        <line x1="160" y1="22.5" x2="135" y2="22.5" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <!-- LED 14 -->
        <rect x="80" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="107" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 14</text>
        <!-- Arrow 14 -> 15 -->
        <line x1="80" y1="22.5" x2="55" y2="22.5" stroke="#10b981" stroke-width="3" marker-end="url(#arrowGreen)"/>

        <!-- LED 15 -->
        <rect x="0" y="0" width="55" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
        <text x="27" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 15</text>
      </g>
    </g>

    <text x="210" y="322" font-family="sans-serif" font-size="11.5" fill="#a7f3d0" text-anchor="middle">✔ Used by 95% of commercial matrices (BTF-Lighting, Adafruit NeoMatrix)</text>
  </g>

  <!-- ==================== RIGHT: PROGRESSIVE (LINEAR) ==================== -->
  <g transform="translate(500, 100)" filter="url(#shadow2)">
    <rect width="420" height="340" rx="12" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="20" y="16" width="380" height="36" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="210" y="38" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">B. Progressive (Linear / Raster) — Type B</text>

    <!-- Grid cells 4 rows x 4 cols demo -->
    <g transform="translate(60, 75)">
      <!-- Row 0: 0 -> 1 -> 2 -> 3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="55" height="45" rx="6" fill="#0369a1" stroke="#38bdf8"/>
        <text x="27" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 0</text>
        <line x1="55" y1="22" x2="80" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="80" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="107" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 1</text>
        <line x1="135" y1="22" x2="160" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="160" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="187" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 2</text>
        <line x1="215" y1="22" x2="240" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="240" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="267" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 3</text>
      </g>

      <!-- Long jump wire from row 0 end back to row 1 start -->
      <path d="M 295 22 C 320 22, -20 82, 0 82" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

      <!-- Row 1: 4 -> 5 -> 6 -> 7 (Always left to right!) -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="27" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 4</text>
        <line x1="55" y1="22" x2="80" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="80" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="107" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 5</text>
        <line x1="135" y1="22" x2="160" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="160" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="187" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 6</text>
        <line x1="215" y1="22" x2="240" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="240" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="267" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 7</text>
      </g>

      <!-- Long jump wire from row 1 end to row 2 start -->
      <path d="M 295 82 C 320 82, -20 142, 0 142" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

      <!-- Row 2: 8 -> 9 -> 10 -> 11 -->
      <g transform="translate(0, 120)">
        <rect x="0" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="27" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 8</text>
        <line x1="55" y1="22" x2="80" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="80" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="107" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 9</text>
        <line x1="135" y1="22" x2="160" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="160" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="187" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 10</text>
        <line x1="215" y1="22" x2="240" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="240" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="267" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 11</text>
      </g>

      <!-- Long jump wire from row 2 end to row 3 start -->
      <path d="M 295 142 C 320 142, -20 202, 0 202" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

      <!-- Row 3: 12 -> 13 -> 14 -> 15 -->
      <g transform="translate(0, 180)">
        <rect x="0" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="27" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 12</text>
        <line x1="55" y1="22" x2="80" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="80" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="107" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 13</text>
        <line x1="135" y1="22" x2="160" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="160" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="187" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 14</text>
        <line x1="215" y1="22" x2="240" y2="22" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)"/>

        <rect x="240" y="0" width="55" height="45" rx="6" fill="#075985" stroke="#38bdf8"/>
        <text x="267" y="27" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">LED 15</text>
      </g>
    </g>

    <text x="210" y="322" font-family="sans-serif" font-size="11.5" fill="#bae6fd" text-anchor="middle">Used when individual strips are aligned with long return traces</text>
  </g>
</svg>
