; PlatformIO Project Configuration for Seeed Studio reTerminal Sticky
; MCU: ESP32-S3R8 (ESP32-S3-WROOM-1-N8R8)
; Display: 3.97" B/W E-Paper 800x480 (SSD1677)

[platformio]
default_envs = seeed_reterminal_sticky

[env:seeed_reterminal_sticky]
platform = espressif32
board = esp32-s3-devkitc1-n8r8
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_RETERMINAL_STICKY

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ricmoo/QRCode @ ^0.0.1

[env:seeed_reterminal_e1001]
extends = env:seeed_reterminal_sticky
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_RETERMINAL_E1001

[env:seeed_reterminal_e1002]
extends = env:seeed_reterminal_sticky
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_RETERMINAL_E1002

[env:seeed_reterminal_e1003]
extends = env:seeed_reterminal_sticky
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_RETERMINAL_E1003

[env:seeed_reterminal_e1004]
extends = env:seeed_reterminal_sticky
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_RETERMINAL_E1004

[env:simulator]
platform = native
lib_compat_mode = off
lib_ldf_mode = deep+
extra_scripts = pre:simulator/pio_flags.py
build_src_filter =
    -<*>
    +<setup_screen.cpp>
    +<imu_driver.cpp>
    +<sht40_driver.cpp>
    +<diag_logger.cpp>
    +<ota_updater.cpp>
    +<../simulator/*.cpp>
build_flags =
    -std=c++17
    -Iinclude
    -Isimulator
    !pkg-config --cflags --libs sdl2 libcurl 2>/dev/null || echo "-I/opt/homebrew/include -I/opt/homebrew/include/SDL2 -I/usr/local/include -I/usr/local/include/SDL2 -L/opt/homebrew/lib -L/usr/local/lib -lSDL2 -lcurl"
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ricmoo/QRCode @ ^0.0.1

[env:test_native]
platform = native
lib_compat_mode = off
test_build_src = yes
extra_scripts = pre:simulator/pio_flags.py
build_src_filter =
    -<*>
    +<setup_screen.cpp>
    +<imu_driver.cpp>
    +<sht40_driver.cpp>
    +<diag_logger.cpp>
    +<ota_updater.cpp>
build_flags =
    -std=c++17
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ricmoo/QRCode @ ^0.0.1

