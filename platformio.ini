; PlatformIO Project Configuration for Seeed Studio reTerminal Sticky
; MCU: ESP32-S3R8 (ESP32-S3-WROOM-1-N8R8)
; Display: 3.97" B/W E-Paper 800x480 (SSD1677)

[platformio]
default_envs = seeed_reterminal_sticky

[env:seeed_reterminal_sticky]
platform = espressif32
board = esp32-s3-devkitc1-n8r8
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_RETERMINAL_STICKY
    -Werror=return-type

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ricmoo/QRCode @ ^0.0.1

[env:seeed_reterminal_e1001]
extends = env:seeed_reterminal_sticky
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_RETERMINAL_E1001
    -Werror=return-type

[env:seeed_reterminal_e1002]
extends = env:seeed_reterminal_sticky
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_RETERMINAL_E1002
    -Werror=return-type

[env:seeed_reterminal_e1003]
extends = env:seeed_reterminal_sticky
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_RETERMINAL_E1003
    -Werror=return-type

[env:seeed_reterminal_e1004]
extends = env:seeed_reterminal_sticky
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_RETERMINAL_E1004
    -Werror=return-type

[env:seeed_xiao_esp32c6_led]
platform = espressif32
board = seeed_xiao_esp32c6
board_build.variant = XIAO_ESP32C6
framework = arduino
board_build.partitions = partitions_4mb.csv
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DDEVICE_XIAO_LED
    -DARDUINO_XIAO_ESP32C6
    -DHAS_XIAO_RF_SWITCH=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Werror=return-type
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ricmoo/QRCode @ ^0.0.1
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit NeoPixel @ ^1.12.3

[env:seeed_xiao_esp32s3_led]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.partitions = partitions.csv
board_build.mcu = esp32s3
board_build.flash_mode = qio
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_XIAO_LED
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Werror=return-type
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ricmoo/QRCode @ ^0.0.1
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit NeoPixel @ ^1.12.3

[env:seeed_xiao_esp32c3_led]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
board_build.partitions = partitions_4mb.csv
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DDEVICE_XIAO_LED
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Werror=return-type
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ricmoo/QRCode @ ^0.0.1
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit NeoPixel @ ^1.12.3

[env:elecrow_crowpanel_43]
platform = espressif32
board = esp32-s3-devkitc1-n4r2
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = partitions_4mb.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDEVICE_CROWPANEL_43
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Werror=return-type
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ricmoo/QRCode @ ^0.0.1
    moononournation/GFX Library for Arduino @ ^1.4.9
    paulstoffregen/XPT2046_Touchscreen @ 0.0.0-alpha+sha.26b691b2c8

[env:simulator]
platform = native
lib_compat_mode = off
lib_ldf_mode = deep+
extra_scripts = pre:simulator/pio_flags.py
build_src_filter =
    -<*>
    +<setup_screen.cpp>
    +<imu_driver.cpp>
    +<sht40_driver.cpp>
    +<diag_logger.cpp>
    +<ota_updater.cpp>
    +<touch_driver.cpp>
    +<../simulator/*.cpp>
build_flags =
    -std=c++17
    -Iinclude
    -Isimulator
    !pkg-config --cflags --libs sdl2 libcurl 2>/dev/null || echo "-I/opt/homebrew/include -I/opt/homebrew/include/SDL2 -I/usr/local/include -I/usr/local/include/SDL2 -L/opt/homebrew/lib -L/usr/local/lib -lSDL2 -lcurl"
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ricmoo/QRCode @ ^0.0.1

[env:test_native]
platform = native
lib_compat_mode = off
test_build_src = yes
extra_scripts = pre:simulator/pio_flags.py
build_src_filter =
    -<*>
    +<setup_screen.cpp>
    +<imu_driver.cpp>
    +<sht40_driver.cpp>
    +<diag_logger.cpp>
    +<ota_updater.cpp>
    +<touch_driver.cpp>
build_flags =
    -std=c++17
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    ricmoo/QRCode @ ^0.0.1

